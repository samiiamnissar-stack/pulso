worker_processes auto;
events { worker_connections 4096; }

http {
  upstream pulso_api {
    least_conn;
    # Si un nodo falla 3 veces en 10 s, se aparta 10 s y el tráfico va a los demás
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    server api-3:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Límite por IP en el borde (además del que tiene la propia API).
  # Las IP privadas quedan fuera para poder hacer pruebas de carga en el laboratorio.
  geo $limitar {
    default        1;
    127.0.0.0/8    0;
    10.0.0.0/8     0;
    172.16.0.0/12  0;
    192.168.0.0/16 0;
  }
  map $limitar $clave_limite {
    0 "";
    1 $binary_remote_addr;
  }
  limit_req_zone $clave_limite zone=porip:10m rate=20r/s;

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 32k;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location /socket.io/ {
      proxy_pass http://pulso_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location /api/ {
      limit_req zone=porip burst=40 nodelay;
      proxy_pass http://pulso_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Si un nodo cae a mitad, se reintenta en otro (solo peticiones idempotentes)
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    location / {
      proxy_pass http://pulso_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
